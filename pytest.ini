[pytest]
# Engine safety net: the integrity guard + the vendored golden suite, plus the
# app-layer enrichment overlay tests (pure functions, run against the vendored engine).
# All of these run without Django/DB. App-layer Django tests run separately via
# `python manage.py test`.
testpaths =
    test_engine_integrity.py
    flexee_engine/vendor/tests
    games/test_enrichment_overlay.py
addopts = -q
